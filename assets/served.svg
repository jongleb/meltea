<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 936 430" width="936" height="430" role="img" aria-label="One Meltea module, page.mlx, built twice. meltea-ppx for the browser compiles the view into a template parsed once and cloned, a walk to the output and a refresh that writes the text only when count changed. meltea-ppx -server compiles the same view into code that writes strings with no DOM, natively or in Node: the static markup joined into a few strings at compile time and one call per dynamic part, the class and the count. The server writes HTML in React&#x27;s format, the same bytes natively and under Melange, and the browser build hydrates it"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="250" height="300" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4" filter="url(#lift)"/><text x="18" y="28" font-size="14" xml:space="preserve" font-weight="700">page.mlx</text><text x="18" y="47" font-size="11.5" xml:space="preserve" class="muted">one module, built twice</text><text x="18" y="80" font-size="11.5" xml:space="preserve" class="mono">let view count =</text><text x="18" y="99" font-size="11.5" xml:space="preserve" class="mono">  &lt;div className=&quot;counter&quot;&gt;</text><text x="18" y="118" font-size="11.5" xml:space="preserve" class="mono">    &lt;button onClick=Decrement&gt;</text><text x="18" y="137" font-size="11.5" xml:space="preserve" class="mono">      (Html.text &quot;-&quot;)</text><text x="18" y="156" font-size="11.5" xml:space="preserve" class="mono">    &lt;/button&gt;</text><text x="18" y="175" font-size="11.5" xml:space="preserve" class="mono">    &lt;output className=<tspan class="orange">tone</tspan>&gt;</text><text x="18" y="194" font-size="11.5" xml:space="preserve" class="mono">      (Html.int <tspan class="orange">count</tspan>)</text><text x="18" y="213" font-size="11.5" xml:space="preserve" class="mono">    &lt;/output&gt;</text><text x="18" y="232" font-size="11.5" xml:space="preserve" class="mono"><tspan class="faint">    …</tspan></text><text x="18" y="251" font-size="11.5" xml:space="preserve" class="mono">  &lt;/div&gt;</text><text x="18" y="284" font-size="11.5" xml:space="preserve" class="muted">model, update, view: plain OCaml</text><path d="M254,110 C280,110 280,70 306,70" fill="none" stroke="#8250df" stroke-width="1.8" marker-end="url(#arrow-accent)" class="flow"/><path d="M254,190 C280,190 280,236 306,236" fill="none" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrow-green)" class="flow"/><rect x="310" y="0" width="570" height="140" rx="14" fill="#f5f0ff" stroke="#8250df" stroke-width="1.4" filter="url(#lift)"/><text x="328" y="28" font-size="13.5" xml:space="preserve" class="accent" font-weight="700">meltea-ppx · in the browser</text><text x="862" y="28" font-size="11.5" xml:space="preserve" class="mono muted" text-anchor="end">meltea</text><text x="328" y="60" font-size="11.5" xml:space="preserve" class="mono">Template.html &quot;&lt;div class=\&quot;counter\&quot;&gt;&lt;button&gt;-&lt;/button&gt;&lt;output&gt;&lt;/output&gt;…&quot;</text><text x="328" y="82" font-size="11.5" xml:space="preserve" class="mono">walk: div.firstChild.nextSibling → output</text><text x="328" y="104" font-size="11.5" xml:space="preserve" class="mono">refresh: if <tspan class="orange">count</tspan> !== last then output.data = String(count)</text><text x="328" y="128" font-size="11.5" xml:space="preserve" class="muted">cloned once, then only the holes whose locals changed are written</text><rect x="310" y="160" width="570" height="140" rx="14" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.4" filter="url(#lift)"/><text x="328" y="188" font-size="13.5" xml:space="preserve" class="green" font-weight="700">meltea-ppx -server · natively or in Node, no DOM</text><text x="862" y="188" font-size="11.5" xml:space="preserve" class="mono muted" text-anchor="end">meltea.server</text><text x="328" y="216" font-size="11.5" xml:space="preserve" class="mono">markup w &quot;&lt;div class=\&quot;counter\&quot;&gt;&lt;button&gt;-&lt;/button&gt;&lt;output&quot;</text><text x="328" y="235" font-size="11.5" xml:space="preserve" class="mono">attribute w &quot;class&quot; (Some <tspan class="orange">tone</tspan>)</text><text x="328" y="254" font-size="11.5" xml:space="preserve" class="mono">markup w &quot;&gt;&quot;; dynamic_text w (string_of_int <tspan class="orange">count</tspan>)</text><text x="328" y="273" font-size="11.5" xml:space="preserve" class="mono">markup w &quot;&lt;/output&gt;&lt;button&gt;+&lt;/button&gt;…&quot;</text><text x="328" y="291" font-size="11.5" xml:space="preserve" class="muted">static markup joined at compile time, one call per dynamic part</text><rect x="0" y="330" width="880" height="84" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="18" y="356" font-size="13" xml:space="preserve" font-weight="700">the HTML, in React&#x27;s format</text><text x="18" y="380" font-size="12" xml:space="preserve" class="mono">&lt;div class=&quot;counter&quot;&gt;&lt;button&gt;-&lt;/button&gt;&lt;output class=&quot;&quot;&gt;<tspan class="green">41</tspan>&lt;/output&gt;&lt;button&gt;+&lt;/button&gt;…&lt;/div&gt;</text><text x="18" y="402" font-size="11.5" xml:space="preserve" class="muted">the same bytes natively and under Melange; floats as JavaScript writes them</text><line x1="595" y1="304" x2="595" y2="326" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#arrow-green)"/><path d="M884,372 C912,372 912,70 884,70" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><text x="862" y="356" font-size="11.5" xml:space="preserve" class="accent" font-weight="600" text-anchor="end">hydrate: the browser build takes these nodes over</text></svg>