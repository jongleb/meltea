<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 408" width="896" height="408" role="img" aria-label="Transitions, as Vue&#x27;s Transition and TransitionGroup, with name fade. Enter: in the patch the new row b gets fade-enter-from and fade-enter-active, two frames later fade-enter-to replaces fade-enter-from while CSS animates, and when the duration is up no classes are left. Leave: the removed row b is put back where it was with fade-leave-from and fade-leave-active, two frames later fade-leave-to, and when the duration is up it leaves the DOM. Move, in a group: row c went first, so after the patch the DOM is c a b but a transform shows every moved row where it was; two frames later the rows get fade-move and the transforms are cleared, so they slide to their new places; at the end no classes are left"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><text x="265" y="18" font-size="12.5" xml:space="preserve" font-weight="700" text-anchor="middle">the patch</text><text x="515" y="18" font-size="12.5" xml:space="preserve" font-weight="700" text-anchor="middle">two frames later: CSS animates</text><text x="765" y="18" font-size="12.5" xml:space="preserve" font-weight="700" text-anchor="middle">when the duration is up</text><line x1="378" y1="14" x2="406" y2="14" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow-muted)" class="flow"/><line x1="628" y1="14" x2="656" y2="14" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow-muted)" class="flow"/><text x="0" y="78" font-size="14" xml:space="preserve" class="accent" font-weight="700">enter</text><text x="0" y="98" font-size="11.5" xml:space="preserve" class="muted">b is new</text><rect x="150" y="40" width="230" height="96" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/><g opacity="1"><rect x="170" y="54" width="50" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4"/><text x="195" y="74" font-size="13" xml:space="preserve" class="mono" font-weight="700" text-anchor="middle">a</text></g><g opacity="0.3"><rect x="236" y="54" width="50" height="30" rx="8" fill="#221a38" stroke="#b58cff" stroke-width="1