<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 418" width="896" height="418" role="img" aria-label="Only the rows whose inputs changed render. Selecting a row of 1,000 renders two rows, as in Vue Vapor. Compiled selectors, after Vue Vapor: a row of Html.list (List.map …) reads its item and the outer value selected through one leaf without JSX; the compiler emits a projection that evaluates only that leaf for each row. When selected goes from Some 2 to Some 5 and the six items are the same objects, only rows 2 and 5 have a changed projection, so only they render, in place; the other four are kept without calling the row function"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">COMPILED SELECTORS</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">Only the rows whose inputs changed render</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">Selecting a row of 1,000 renders two rows, as in Vue Vapor.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><rect x="0" y="0" width="404" height="310" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#lift)"/><text x="18" y="28" font-size="13.5" xml:space="preserve" font-weight="700">a row reads its item and one outer value</text><rect x="132.18" y="70" width="193.98000000000002" height="46" rx="7" fill="#12261a" stroke="#3fb950" stroke-width="1.3" stroke-dasharray="4 3"/><text x="18" y="66" font-size="12" xml:space="preserve" class="mono">Html.list (List.map (fun row -&gt;</text><text x="18" y="90" font-size="12" xml:space="preserve" class="mono">  &lt;tr className=<tspan class="green">(if Some row.id = selected</tspan></text><text x="18" y="114" font-size="12" xml:space="preserve" class="mono">                 <tspan class="green">then &quot;danger&quot; else &quot;&quot;)</tspan>&gt;</text><text x="18" y="138" font-size="12" xml:space="preserve" class="mono">    &lt;td&gt;(Html.text row.label)&lt;/td&gt;</text><text x="18" y="162" font-size="12" xml:space="preserve" class="mono">  &lt;/tr&gt;) rows)</text><text x="18" y="204" font-size="11.5" xml:space="preserve" class="muted">The leaf has no JSX and reads the outer</text><text x="18" y="222" font-size="11.5" xml:space="preserve" class="muted">selected. The compiler emits a projection:</text><text x="18" y="248" font-size="12.5" xml:space="preserve" class="mono green" font-weight="700">fun row -&gt; [| leaf row |]</text><text x="18" y="278" font-size="11.5" xml:space="preserve" class="muted">A row renders only if its item is another</text><text x="18" y="296" font-size="11.5" xml:space="preserve" class="muted">object or its projection changed.</text><text x="430" y="24" font-size="13.5" xml:space="preserve" font-weight="700">selected: Some 2 → Some 5</text><text x="868" y="24" font-size="11.5" xml:space="preserve" class="muted" text-anchor="end">6 items, same objects</text><text x="446" y="50" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">row</text><text x="500" y="50" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">item</text><text x="580" y="50" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">projection</text><text x="866" y="50" font-size="11.5" xml:space="preserve" class="muted" font-weight="600" text-anchor="end">row is</text><rect x="430" y="62" width="450" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="446" y="82" font-size="12.5" xml:space="preserve" class="mono" font-weight="700">1</text><text x="500" y="82" font-size="12" xml:space="preserve" class="mono green">===</text><text x="580" y="82" font-size="12" xml:space="preserve" class="mono muted">&quot;&quot; → &quot;&quot;</text><text x="866" y="82" font-size="12" xml:space="preserve" class="green" font-weight="700" text-anchor="end">kept</text><rect x="430" y="98" width="450" height="30" rx="8" fill="#221a38" stroke="#b58cff" stroke-width="1.3" filter="url(#lift)"/><text x="446" y="118" font-size="12.5" xml:space="preserve" class="mono" font-weight="700">2</text><text x="500" y="118" font-size="12" xml:space="preserve" class="mono green">===</text><text x="580" y="118" font-size="12" xml:space="preserve" class="mono accent" font-weight="600">&quot;danger&quot; → &quot;&quot;</text><text x="866" y="118" font-size="12" xml:space="preserve" class="accent" font-weight="700" text-anchor="end">rendered</text><rect x="430" y="134" width="450" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="446" y="154" font-size="12.5" xml:space="preserve" class="mono" font-weight="700">3</text><text x="500" y="154" font-size="12" xml:space="preserve" class="mono green">===</text><text x="580" y="154" font-size="12" xml:space="preserve" class="mono muted">&quot;&quot; → &quot;&quot;</text><text x="866" y="154" font-size="12" xml:space="preserve" class="green" font-weight="700" text-anchor="end">kept</text><rect x="430" y="170" width="450" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="446" y="190" font-size="12.5" xml:space="preserve" class="mono" font-weight="700">4</text><text x="500" y="190" font-size="12" xml:space="preserve" class="mono green">===</text><text x="580" y="190" font-size="12" xml:space="preserve" class="mono muted">&quot;&quot; → &quot;&quot;</text><text x="866" y="190" font-size="12" xml:space="preserve" class="green" font-weight="700" text-anchor="end">kept</text><rect x="430" y="206" width="450" height="30" rx="8" fill="#221a38" stroke="#b58cff" stroke-width="1.3" filter="url(#lift)"/><text x="446" y="226" font-size="12.5" xml:space="preserve" class="mono" font-weight="700">5</text><text x="500" y="226" font-size="12" xml:space="preserve" class="mono green">===</text><text x="580" y="226" font-size="12" xml:space="preserve" class="mono accent" font-weight="600">&quot;&quot; → &quot;danger&quot;</text><text x="866" y="226" font-size="12" xml:space="preserve" class="accent" font-weight="700" text-anchor="end">rendered</text><rect x="430" y="242" width="450" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="446" y="262" font-size="12.5" xml:space="preserve" class="mono" font-weight="700">6</text><text x="500" y="262" font-size="12" xml:space="preserve" class="mono green">===</text><text x="580" y="262" font-size="12" xml:space="preserve" class="mono muted">&quot;&quot; → &quot;&quot;</text><text x="866" y="262" font-size="12" xml:space="preserve" class="green" font-weight="700" text-anchor="end">kept</text><text x="430" y="296" font-size="11.5" xml:space="preserve" class="muted">keys in the same order: the two rows are patched in place</text></g></svg>