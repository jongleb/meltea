<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" width="880" height="232" role="img" aria-label="Meltea is compiled like Svelte: the dynamic part of the view you write in mlx becomes a hole in static HTML that is cloned on mount, and every update compares count with its last value and writes the hole&#x27;s text node directly; there is no virtual DOM"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><rect x="0" y="0" width="370" height="190" rx="14" fill="#161b22" stroke="#b58cff" stroke-width="1.6" filter="url(#lift)"/><text x="20" y="30" font-size="13" xml:space="preserve" class="accent" font-weight="700">you write</text><text x="20" y="66" font-size="14" xml:space="preserve" class="mono">let view count =</text><text x="20" y="94" font-size="14" xml:space="preserve" class="mono">  &lt;output&gt;</text><rect x="49.72" y="105" width="142.88" height="24" rx="6" fill="#12261a" stroke="#3fb950" stroke-width="1.3" stroke-dasharray="4 3"/><text x="20" y="122" font-size="14" xml:space="preserve" class="mono">    (Html.int <tspan class="accent">count</tspan>)</text><text x="20" y="150" font-size="14" xml:space="preserve" class="mono">  &lt;/output&gt;</text><text x="440" y="83" font-size="13" xml:space="preserve" class="accent" font-weight="800" text-anchor="middle">Meltea</text><line x1="384" y1="95" x2="496" y2="95" stroke="#b58cff" stroke-width="2" marker-end="url(#arrow-accent)" class="flow"/><text x="440" y="117" font-size="11.5" xml:space="preserve" class="muted" text-anchor="middle">compiles it once,</text><text x="440" y="133" font-size="11.5" xml:space="preserve" class="muted" text-anchor="middle">at build time</text><rect x="510" y="0" width="370" height="190" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="1.6" filter="url(#lift)"/><text x="530" y="30" font-size="13" xml:space="preserve" class="green" font-weight="700">and gets</text><text x="530" y="56" font-size="11" xml:space="preserve" class="faint">the static HTML, cloned on mount</text><text x="530" y="80" font-size="14" xml:space="preserve" class="mono">&lt;output&gt;</text><rect x="605.44" y="63" width="41.72" height="24" rx="6" fill="#12261a" stroke="#3fb950" stroke-width="1.3" stroke-dasharray="4 3"/><text x="609.44" y="80" font-size="14" xml:space="preserve" class="mono green" font-weight="700">text</text><text x="655.16" y="80" font-size="14" xml:space="preserve" class="mono">&lt;/output&gt;</text><text x="530" y="120" font-size="11" xml:space="preserve" class="faint">on every update</text><text x="530" y="146" font-size="14" xml:space="preserve" class="mono">if (<tspan class="accent">count</tspan> !== last)</text><text x="530" y="172" font-size="14" xml:space="preserve" class="mono">  <tspan class="green">text</tspan>.data = String(<tspan class="accent">count</tspan>)</text><text x="440" y="222" font-size="13" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">no virtual DOM: when count changes, one comparison and one write</text></svg>