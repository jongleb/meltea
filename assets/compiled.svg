<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" width="880" height="232" role="img" aria-label="Meltea is compiled like Svelte: the view you write in mlx becomes, at build time, a template cloned once and an update that checks count and writes its text node directly; there is no virtual DOM"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="370" height="190" rx="14" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6" filter="url(#lift)"/><text x="20" y="30" font-size="13" xml:space="preserve" class="accent" font-weight="700">you write</text><text x="20" y="62" font-size="14" xml:space="preserve" class="mono">let view count =</text><text x="20" y="88" font-size="14" xml:space="preserve" class="mono">  &lt;output&gt;</text><text x="20" y="114" font-size="14" xml:space="preserve" class="mono">    (Html.int <tspan class="accent">count</tspan>)</text><text x="20" y="140" font-size="14" xml:space="preserve" class="mono">  &lt;/output&gt;</text><line x1="384" y1="95" x2="496" y2="95" stroke="#8250df" stroke-width="2" marker-end="url(#arrow-accent)" class="flow"/><text x="440" y="83" font-size="12" xml:space="preserve" class="mono accent" font-weight="700" text-anchor="middle">meltea-ppx</text><text x="440" y="117" font-size="11.5" xml:space="preserve" class="muted" text-anchor="middle">at build time</text><rect x="510" y="0" width="370" height="190" rx="14" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.6" filter="url(#lift)"/><text x="530" y="30" font-size="13" xml:space="preserve" class="green" font-weight="700">the compiler writes</text><text x="530" y="62" font-size="14" xml:space="preserve" class="mono">&lt;output&gt; &lt;/output&gt;</text><text x="530" y="88" font-size="14" xml:space="preserve" class="mono"></text><text x="530" y="114" font-size="14" xml:space="preserve" class="mono"></text><text x="530" y="140" font-size="14" xml:space="preserve" class="mono">if (<tspan class="accent">count</tspan> changed)</text><text x="530" y="166" font-size="14" xml:space="preserve" class="mono"><tspan class="green">  text.data = String(</tspan><tspan class="accent">count</tspan><tspan class="green">)</tspan></text><text x="530" y="84" font-size="11" xml:space="preserve" class="faint">the template, cloned once</text><text x="530" y="120" font-size="11" xml:space="preserve" class="faint">every update</text><text x="440" y="222" font-size="13" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">no virtual DOM: an update compares count once and writes one text node</text></svg>