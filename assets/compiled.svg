<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 456" width="880" height="456" role="img" aria-label="The counter in Meltea: you write the view in mlx; Meltea compiles it into a template tree of div, two buttons and an output whose text is the only hole; when + is clicked the update makes count 42, the compiled code compares count with its last value and writes 42 into that one text node; the grey static nodes get no DOM writes; there is no virtual DOM"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="380" height="410" rx="14" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6" filter="url(#lift)"/><text x="20" y="32" font-size="13.5" xml:space="preserve" class="accent" font-weight="700">you write the counter</text><text x="20" y="76" font-size="13" xml:space="preserve" class="mono">let view count =</text><text x="20" y="108" font-size="13" xml:space="preserve" class="mono">  &lt;div&gt;</text><text x="20" y="140" font-size="13" xml:space="preserve" class="mono">    &lt;button onClick=<tspan class="accent">Decrement</tspan>&gt;</text><text x="20" y="172" font-size="13" xml:space="preserve" class="mono">      (Html.text &quot;-&quot;)&lt;/button&gt;</text><text x="20" y="204" font-size="13" xml:space="preserve" class="mono">    &lt;output&gt;</text><rect x="61.980000000000004" y="218" width="135.28" height="26" rx="6" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.3" stroke-dasharray="4 3"/><text x="20" y="236" font-size="13" xml:space="preserve" class="mono">      (Html.int <tspan class="green">count</tspan>)</text><text x="20" y="268" font-size="13" xml:space="preserve" class="mono">    &lt;/output&gt;</text><text x="20" y="300" font-size="13" xml:space="preserve" class="mono">    &lt;button onClick=<tspan class="accent">Increment</tspan>&gt;</text><text x="20" y="332" font-size="13" xml:space="preserve" class="mono">      (Html.text &quot;+&quot;)&lt;/button&gt;</text><text x="20" y="364" font-size="13" xml:space="preserve" class="mono">  &lt;/div&gt;</text><text x="655" y="14" font-size="12.5" xml:space="preserve" font-weight="700" text-anchor="middle">in the page: click +</text><rect x="535" y="24" width="240" height="60" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" filter="url(#lift)"/><rect x="547" y="36" width="44" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="569" y="61" font-size="18" xml:space="preserve" font-weight="600" text-anchor="middle">−</text><rect x="719" y="36" width="44" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="741" y="61" font-size="18" xml:space="preserve" font-weight="600" text-anchor="middle">+</text><text x="655" y="63" font-size="22" xml:space="preserve" class="mono" font-weight="700" text-anchor="middle">41</text><path d="M751,52 l0,17 l4.5,-4 l3,7 l3,-1.4 l-3,-7 l6,0 z" fill="#1f2328" stroke="#f6f8fa" stroke-width="1"/><line x1="655" y1="90" x2="655" y2="118" stroke="#8250df" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><text x="665" y="108" font-size="11.5" xml:space="preserve" class="muted"><tspan class="accent">Increment</tspan> → update: count = 42</text><rect x="440" y="124" width="430" height="196" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="458" y="146" font-size="11.5" xml:space="preserve" class="faint">the template Meltea compiled: no DOM writes to the grey nodes</text><line x1="655" y1="185" x2="515" y2="207" stroke="#d0d7de" stroke-width="1.5"/><line x1="655" y1="185" x2="655" y2="207" stroke="#d0d7de" stroke-width="1.5"/><line x1="655" y1="185" x2="795" y2="207" stroke="#d0d7de" stroke-width="1.5"/><line x1="515" y1="233" x2="515" y2="255" stroke="#d0d7de" stroke-width="1.5"/><line x1="655" y1="233" x2="655" y2="255" stroke="#d0d7de" stroke-width="1.5"/><line x1="795" y1="233" x2="795" y2="255" stroke="#d0d7de" stroke-width="1.5"/><rect x="627.0" y="159" width="56" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="655" y="176.5" font-size="12" xml:space="preserve" class="mono muted" text-anchor="middle">div</text><rect x="477.0" y="207" width="76" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="515" y="224.5" font-size="12" xml:space="preserve" class="mono muted" text-anchor="middle">button</text><rect x="617.0" y="207" width="76" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="655" y="224.5" font-size="12" xml:space="preserve" class="mono muted" text-anchor="middle">output</text><rect x="757.0" y="207" width="76" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="795" y="224.5" font-size="12" xml:space="preserve" class="mono muted" text-anchor="middle">button</text><rect x="492.0" y="255" width="46" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="515" y="272.5" font-size="12" xml:space="preserve" class="mono muted" text-anchor="middle">&quot;−&quot;</text><rect x="772.0" y="255" width="46" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="795" y="272.5" font-size="12" xml:space="preserve" class="mono muted" text-anchor="middle">&quot;+&quot;</text><rect x="603" y="255" width="104" height="26" rx="6" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.3" stroke-dasharray="4 3"/><text x="655" y="272.5" font-size="12" xml:space="preserve" class="mono green" font-weight="700" text-anchor="middle">text 41→42</text><text x="523" y="306" font-size="12.5" xml:space="preserve" class="mono">if (<tspan class="green">count</tspan> !== last) <tspan class="green">text.data = &quot;42&quot;</tspan></text><line x1="655" y1="326" x2="655" y2="344" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#arrow-green)" class="flow"/><rect x="535" y="350" width="240" height="60" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" filter="url(#lift)"/><rect x="547" y="362" width="44" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="569" y="387" font-size="18" xml:space="preserve" font-weight="600" text-anchor="middle">−</text><rect x="719" y="362" width="44" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="741" y="387" font-size="18" xml:space="preserve" font-weight="600" text-anchor="middle">+</text><rect x="625" y="365" width="60" height="26" rx="6" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.3" stroke-dasharray="4 3"/><text x="655" y="389" font-size="22" xml:space="preserve" class="mono green" font-weight="700" text-anchor="middle">42</text><text x="440" y="446" font-size="13" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">no virtual DOM: Meltea compiles the view at build time into code like Svelte&#x27;s</text></svg>