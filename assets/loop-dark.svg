<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 186" width="880" height="186" role="img" aria-label="The Meltea loop: a DOM event becomes a message, the pure update returns the next model, the pure view gives the hole values, each is compared with === and only the changed one is written to the DOM; the next event starts the loop again"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><text x="0" y="18" font-size="12.5" xml:space="preserve" class="muted" font-weight="600">the Meltea loop: everything between the event and the write is a pure function</text><rect x="0" y="40" width="130" height="64" rx="12" fill="#2b1d12" stroke="#f0883e" stroke-width="1.5" filter="url(#lift)"/><text x="65" y="68" font-size="13" xml:space="preserve" font-weight="700" text-anchor="middle">click</text><text x="65" y="90" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">a DOM event</text><line x1="132" y1="72" x2="146" y2="72" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="150" y="40" width="130" height="64" rx="12" fill="#221a38" stroke="#b58cff" stroke-width="1.5" filter="url(#lift)"/><text x="215" y="68" font-size="13" xml:space="preserve" class="mono" font-weight="700" text-anchor="middle">Increment</text><text x="215" y="90" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">the message</text><line x1="282" y1="72" x2="296" y2="72" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="300" y="40" width="130" height="64" rx="12" fill="#221a38" stroke="#b58cff" stroke-width="1.5" filter="url(#lift)"/><text x="365" y="68" font-size="13" xml:space="preserve" font-weight="700" text-anchor="middle">update</text><text x="365" y="90" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">pure: model → model</text><line x1="432" y1="72" x2="446" y2="72" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="450" y="40" width="130" height="64" rx="12" fill="#221a38" stroke="#b58cff" stroke-width="1.5" filter="url(#lift)"/><text x="515" y="68" font-size="13" xml:space="preserve" font-weight="700" text-anchor="middle">view</text><text x="515" y="90" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">pure: model → holes</text><line x1="582" y1="72" x2="596" y2="72" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="600" y="40" width="130" height="64" rx="12" fill="#0f2136" stroke="#58a6ff" stroke-width="1.5" filter="url(#lift)"/><text x="665" y="68" font-size="13" xml:space="preserve" class="mono" font-weight="700" text-anchor="middle">&quot;42&quot; != &quot;41&quot;</text><text x="665" y="90" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">=== per hole</text><line x1="732" y1="72" x2="746" y2="72" stroke="#b58cff" stroke-width="1.6" marker-end="url(#arrow-accent)" class="flow"/><rect x="750" y="40" width="130" height="64" rx="12" fill="#12261a" stroke="#3fb950" stroke-width="1.5" filter="url(#lift)"/><text x="815" y="68" font-size="13" xml:space="preserve" class="mono" font-weight="700" text-anchor="middle">text &quot;42&quot;</text><text x="815" y="90" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">one DOM write</text><path d="M815,106 C815,170 65,170 65,108" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#arrow-muted)" class="flow"/><text x="440" y="178" font-size="11.5" xml:space="preserve" class="muted" text-anchor="middle">the next event</text></svg>