<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 468" width="896" height="468" role="img" aria-label="It knows what each message changes. So a message that changes nothing the view reads does not even call the view. Fields an update changes, in Meltea&#x27;s TodoMVC: meltea-ppx reads update and finds what each message can change: Type changes field, Route changes filter, Add changes todos, field and next, Ignore changes nothing, and Edit, which it does not recognise, changes all fields. It reads view the same way: todos, field, editing and filter, never next. After Ignore nothing the view reads changed, so the view is not called; after Type the view&#x27;s slice runs and evaluates only the holes that read field. subscriptions are read the same way, and are asked again only after a draw that changed a field they read"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">A COMPILER THAT SEES WRITERS</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">It knows what each message changes</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">So a message that changes nothing the view reads does not even call the view.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><rect x="0" y="0" width="490" height="300" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" filter="url(#lift)"/><text x="18" y="28" font-size="13.5" xml:space="preserve" font-weight="700">meltea-ppx reads update: what each message changes</text><text x="18" y="77" font-size="11.5" xml:space="preserve" class="mono">| Type field -&gt; { model with field }</text><rect x="423.5" y="62" width="50.5" height="22" rx="11" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="448.75" y="77" font-size="11" xml:space="preserve" class="mono accent" font-weight="700" text-anchor="middle">field</text><text x="18" y="121" font-size="11.5" xml:space="preserve" class="mono">| Route filter -&gt; { model with filter }</text><rect x="416.6" y="106" width="57.400000000000006" height="22" rx="11" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="445.3" y="121" font-size="11" xml:space="preserve" class="mono accent" font-weight="700" text-anchor="middle">filter</text><text x="18" y="165" font-size="11.5" xml:space="preserve" class="mono">| Add -&gt; { model with todos; field; next }</text><rect x="430.4" y="150" width="43.6" height="22" rx="11" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="452.2" y="165" font-size="11" xml:space="preserve" class="mono accent" font-weight="700" text-anchor="middle">next</text><rect x="373.9" y="150" width="50.5" height="22" rx="11" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="399.15" y="165" font-size="11" xml:space="preserve" class="mono accent" font-weight="700" text-anchor="middle">field</text><rect x="317.4" y="150" width="50.5" height="22" rx="11" fill="#f5f0ff" stroke="#8250df" stroke-width="1.2"/><text x="342.65" y="165" font-size="11" xml:space="preserve" class="mono accent" font-weight="700" text-anchor="middle">todos</text><text x="18" y="209" font-size="11.5" xml:space="preserve" class="mono">| Ignore -&gt; model</text><rect x="409.7" y="194" width="64.30000000000001" height="22" rx="11" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.2"/><text x="441.85" y="209" font-size="11" xml:space="preserve" class="mono green" font-weight="700" text-anchor="middle">nothing</text><text x="18" y="253" font-size="11.5" xml:space="preserve" class="mono">| Edit id -&gt; Option.fold …</text><rect x="437.3" y="238" width="36.7" height="22" rx="11" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.2"/><text x="455.65000000000003" y="253" font-size="11" xml:space="preserve" class="mono orange" font-weight="700" text-anchor="middle">all</text><text x="18" y="288" font-size="11.5" xml:space="preserve" class="muted">a branch it does not recognise changes all fields: slower, never wrong</text><rect x="520" y="0" width="360" height="96" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" filter="url(#lift)"/><text x="538" y="28" font-size="13.5" xml:space="preserve" font-weight="700">and view: the fields it reads</text><rect x="538" y="44" width="50.5" height="22" rx="11" fill="#eef6ff" stroke="#0969da" stroke-width="1.2"/><text x="563.25" y="59" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">todos</text><rect x="596.5" y="44" width="50.5" height="22" rx="11" fill="#eef6ff" stroke="#0969da" stroke-width="1.2"/><text x="621.75" y="59" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">field</text><rect x="655.0" y="44" width="64.30000000000001" height="22" rx="11" fill="#eef6ff" stroke="#0969da" stroke-width="1.2"/><text x="687.15" y="59" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">editing</text><rect x="727.3" y="44" width="57.400000000000006" height="22" rx="11" fill="#eef6ff" stroke="#0969da" stroke-width="1.2"/><text x="756.0" y="59" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">filter</text><text x="538" y="84" font-size="11.5" xml:space="preserve" class="muted">next is never read</text><rect x="520" y="112" width="360" height="88" rx="14" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.4"/><text x="538" y="140" font-size="13" xml:space="preserve" class="mono green" font-weight="700">Ignore</text><text x="538" y="164" font-size="12" xml:space="preserve" class="mono">changes { } ∩ reads = ∅</text><text x="538" y="186" font-size="11.5" xml:space="preserve" class="muted">the view is not called at all</text><rect x="520" y="210" width="360" height="88" rx="14" fill="#f5f0ff" stroke="#8250df" stroke-width="1.4"/><text x="538" y="238" font-size="13" xml:space="preserve" class="mono accent" font-weight="700">Type &quot;milk&quot;</text><text x="538" y="262" font-size="12" xml:space="preserve" class="mono">changes { field } ∩ reads = { field }</text><text x="538" y="284" font-size="11.5" xml:space="preserve" class="muted">the slice runs: only holes that read field</text><text x="440" y="330" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">The masks are generated next to update and view; Program keeps the fields changed since the last draw.</text><text x="440" y="352" font-size="12" xml:space="preserve" class="muted" text-anchor="middle">Subscriptions are read the same way: TodoMVC&#x27;s reads no field, so it is asked once, at the start.</text></g></svg>