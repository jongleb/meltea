<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 202" width="896" height="202" role="img" aria-label="Hot reload in Meltea: a program runs on the root with its model and the shape of its module&#x27;s types. After an edit, Vite runs main.mlx again, and Program.element with ~start:Program.hot finds the running program; when the new code&#x27;s shape is the same, the model carries over and the new view and update show the old state; when the types changed, the program starts from init. meltea-ppx writes the shape, a digest of the type declarations, next to update"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="250" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3" filter="url(#lift)"/><text x="18" y="28" font-size="13.5" xml:space="preserve" font-weight="700">running on #root</text><text x="18" y="56" font-size="11.5" xml:space="preserve" class="muted">model</text><text x="18" y="76" font-size="11.5" xml:space="preserve" class="mono">{ todos = [milk];</text><text x="18" y="94" font-size="11.5" xml:space="preserve" class="mono">  field = &quot;half typed&quot; }</text><text x="18" y="124" font-size="11.5" xml:space="preserve" class="muted">shape</text><text x="64" y="124" font-size="11.5" xml:space="preserve" class="mono accent" font-weight="700">a3f1…</text><line x1="254" y1="75" x2="300" y2="75" stroke="#59636e" stroke-width="1.6" marker-end="url(#arrow-muted)" class="flow"/><text x="277" y="64" font-size="11" xml:space="preserve" class="muted" text-anchor="middle">edit</text><rect x="304" y="0" width="250" height="150" rx="14" fill="#f5f0ff" stroke="#8250df" stroke-width="1.3" filter="url(#lift)"/><text x="322" y="28" font-size="13.5" xml:space="preserve" class="accent" font-weight="700">new code arrives</text><text x="322" y="54" font-size="11.5" xml:space="preserve" class="muted">Vite re-runs main.mlx:</text><text x="322" y="76" font-size="11.5" xml:space="preserve" class="mono">Program.element</text><text x="322" y="94" font-size="11.5" xml:space="preserve" class="mono">  ~start:Program.hot …</text><text x="322" y="124" font-size="11.5" xml:space="preserve" class="muted">shape of its types</text><text x="452" y="124" font-size="11.5" xml:space="preserve" class="mono accent" font-weight="700">a3f1…</text><path d="M558,50 C590,50 590,24 622,24" fill="none" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrow-green)" class="flow"/><path d="M558,100 C590,100 590,124 622,124" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#arrow-orange)" class="flow"/><rect x="626" y="0" width="254" height="66" rx="12" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.3"/><text x="642" y="26" font-size="12" xml:space="preserve" class="green" font-weight="700">same shape: the model carries over</text><text x="642" y="48" font-size="11.5" xml:space="preserve" class="muted">new view and update, old state</text><rect x="626" y="90" width="254" height="60" rx="12" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.3"/><text x="642" y="114" font-size="12" xml:space="preserve" class="orange" font-weight="700">types changed: start from init</text><text x="642" y="136" font-size="11.5" xml:space="preserve" class="muted">the old model may not fit them</text><text x="0" y="180" font-size="11.5" xml:space="preserve" class="muted">meltea-ppx writes the shape, a digest of the module&#x27;s type declarations, next to update; the old program stops and leaves the root.</text></svg>