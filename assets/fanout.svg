<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 462" width="896" height="462" role="img" aria-label="The compiler warns when typing would check a whole list. From the event to the message, the fields it writes and the lists that read them, with no annotations. Fanout in Meltea&#x27;s TodoMVC: meltea-ppx follows a frequent event to the lists it reaches. The edit field&#x27;s onInput sends Retype, whose branch of update writes editing, and the list in view reads todos, filter and editing, so every keystroke makes the list check all its rows; the compiler raises the alert fanout at the handler. The new-todo field&#x27;s onInput sends Type, which writes field, which no list reads, so typing writes one hole and there is no alert. A key handler&#x27;s literal branch such as Enter sends Add once and does not count"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">FANOUT ALERTS</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">The compiler warns when typing would check a whole list</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">From the event to the message, the fields it writes and the lists that read them, with no annotations.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><rect x="0" y="0" width="250" height="96" rx="12" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.3" filter="url(#lift)"/><text x="14" y="22" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">the handler, frequent</text><text x="14" y="46" font-size="11.5" xml:space="preserve" class="mono">onInput=(fun t -&gt; Retype t)</text><rect x="276" y="0" width="130" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3" filter="url(#lift)"/><text x="290" y="22" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">sends</text><text x="290" y="46" font-size="11.5" xml:space="preserve" class="mono">Retype</text><rect x="432" y="0" width="200" height="96" rx="12" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.3" filter="url(#lift)"/><text x="446" y="22" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">update writes</text><text x="446" y="46" font-size="11.5" xml:space="preserve" class="mono">{ model with editing }</text><rect x="658" y="0" width="222" height="96" rx="12" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.3" filter="url(#lift)"/><text x="672" y="22" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">view: a list reads</text><text x="672" y="46" font-size="11.5" xml:space="preserve" class="mono">List.map (row editing) …</text><line x1="252" y1="48" x2="272" y2="48" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#arrow-orange)" class="flow"/><line x1="408" y1="48" x2="428" y2="48" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#arrow-orange)" class="flow"/><line x1="634" y1="48" x2="654" y2="48" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#arrow-orange)" class="flow"/><rect x="446" y="62" width="64.30000000000001" height="22" rx="11" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.2"/><text x="478.15" y="77" font-size="11" xml:space="preserve" class="mono orange" font-weight="700" text-anchor="middle">editing</text><rect x="672" y="62" width="50.5" height="22" rx="11" fill="#eef6ff" stroke="#0969da" stroke-width="1.2"/><text x="697.25" y="77" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">todos</text><rect x="728.5" y="62" width="57.400000000000006" height="22" rx="11" fill="#eef6ff" stroke="#0969da" stroke-width="1.2"/><text x="757.2" y="77" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">filter</text><rect x="791.9" y="62" width="64.30000000000001" height="22" rx="11" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.2"/><text x="824.05" y="77" font-size="11" xml:space="preserve" class="mono orange" font-weight="700" text-anchor="middle">editing</text><rect x="0" y="124" width="250" height="96" rx="12" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.3" filter="url(#lift)"/><text x="14" y="146" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">the handler, frequent</text><text x="14" y="170" font-size="11.5" xml:space="preserve" class="mono">onInput=(fun t -&gt; Type t)</text><rect x="276" y="124" width="130" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3" filter="url(#lift)"/><text x="290" y="146" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">sends</text><text x="290" y="170" font-size="11.5" xml:space="preserve" class="mono">Type</text><rect x="432" y="124" width="200" height="96" rx="12" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.3" filter="url(#lift)"/><text x="446" y="146" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">update writes</text><text x="446" y="170" font-size="11.5" xml:space="preserve" class="mono">{ model with field }</text><rect x="658" y="124" width="222" height="96" rx="12" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.3" filter="url(#lift)"/><text x="672" y="146" font-size="11.5" xml:space="preserve" class="muted" font-weight="600">view: a list reads</text><text x="672" y="170" font-size="11.5" xml:space="preserve" class="mono">List.map (row editing) …</text><line x1="252" y1="172" x2="272" y2="172" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#arrow-green)" class="flow"/><line x1="408" y1="172" x2="428" y2="172" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#arrow-green)" class="flow"/><line x1="634" y1="172" x2="654" y2="172" stroke="#59636e" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="446" y="186" width="50.5" height="22" rx="11" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.2"/><text x="471.25" y="201" font-size="11" xml:space="preserve" class="mono green" font-weight="700" text-anchor="middle">field</text><rect x="672" y="186" width="50.5" height="22" rx="11" fill="#eef6ff" stroke="#0969da" stroke-width="1.2"/><text x="697.25" y="201" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">todos</text><rect x="728.5" y="186" width="57.400000000000006" height="22" rx="11" fill="#eef6ff" stroke="#0969da" stroke-width="1.2"/><text x="757.2" y="201" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">filter</text><rect x="791.9" y="186" width="64.30000000000001" height="22" rx="11" fill="#eef6ff" stroke="#0969da" stroke-width="1.2"/><text x="824.05" y="201" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">editing</text><text x="0" y="244" font-size="12" xml:space="preserve" class="orange" font-weight="700">the edit field: every keystroke reaches the list</text><text x="880" y="244" font-size="12" xml:space="preserve" class="green" font-weight="700" text-anchor="end">the new-todo field: no list reads field, one hole is written</text><rect x="0" y="262" width="880" height="92" rx="14" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.3"/><text x="18" y="288" font-size="13" xml:space="preserve" class="orange" font-weight="700">Alert fanout</text><text x="118" y="288" font-size="11.5" xml:space="preserve" class="muted">at the handler, from meltea-ppx, with no annotations</text><text x="18" y="312" font-size="11.5" xml:space="preserve" class="mono">each input event here sends Retype, which changes editing; the list at line 187 reads editing,</text><text x="18" y="330" font-size="11.5" xml:space="preserve" class="mono">so every input event checks all of its rows</text><text x="862" y="346" font-size="11" xml:space="preserve" class="muted" text-anchor="end">&quot;Enter&quot; -&gt; Add is one action, not every key: it does not count</text></g></svg>