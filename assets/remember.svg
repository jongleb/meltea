<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 398" width="896" height="398" role="img" aria-label="Derived data is computed again only when its fields change. A filtered list stays the same object while its inputs do, so its hole is skipped. Remembered values in a Meltea view: Type m changes only the draft field. Without remembering, let shown = List.filter over model.items builds a new list on every call, so the list hole sees a different value and checks all 1,000 rows. meltea-ppx compiles the let to View.remember keyed by model.filter and model.items; both are the same objects, so the old list comes back, the hole is skipped, and only the draft hole is written"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #59636e; } .faint { fill: #8c959f; }.accent { fill: #8250df; } .green { fill: #1a7f37; }.orange { fill: #bc4c00; } .blue { fill: #0969da; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">REMEMBERED VALUES</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">Derived data is computed again only when its fields change</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">A filtered list stays the same object while its inputs do, so its hole is skipped.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><text x="0" y="20" font-size="14" xml:space="preserve" class="mono accent" font-weight="700">Type &quot;m&quot;</text><text x="80" y="20" font-size="12.5" xml:space="preserve" class="muted">changes only draft; the view runs because it reads draft</text><rect x="0" y="52" width="420" height="236" rx="14" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.4" filter="url(#lift)"/><text x="18" y="80" font-size="13.5" xml:space="preserve" class="orange" font-weight="700">without</text><text x="18" y="99" font-size="11.5" xml:space="preserve" class="muted">every let computed again</text><text x="18" y="132" font-size="11.5" xml:space="preserve" class="mono">let shown = List.filter … model.items</text><text x="18" y="154" font-size="11.5" xml:space="preserve" class="mono"><tspan class="orange">  → a new list, every call</tspan></text><text x="18" y="176" font-size="11.5" xml:space="preserve" class="mono">&lt;ul&gt;(Html.list (List.map row shown))&lt;/ul&gt;</text><text x="18" y="198" font-size="11.5" xml:space="preserve" class="mono"><tspan class="orange">  shown !== last shown → the list runs</tspan></text><rect x="18" y="232" width="384" height="40" rx="10" fill="#fff4e8" stroke="#bc4c00" stroke-width="1.1"/><text x="32" y="257" font-size="12" xml:space="preserve" class="orange" font-weight="700">1,000 rows checked for one keystroke</text><rect x="460" y="52" width="420" height="236" rx="14" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.4" filter="url(#lift)"/><text x="478" y="80" font-size="13.5" xml:space="preserve" class="green" font-weight="700">remembered by what it reads</text><text x="478" y="99" font-size="11.5" xml:space="preserve" class="muted">meltea-ppx knows the fields of each let</text><text x="478" y="132" font-size="11.5" xml:space="preserve" class="mono">let shown = View.remember m</text><text x="478" y="154" font-size="11.5" xml:space="preserve" class="mono">  [| model.filter; model.items |] (fun () -&gt; …)</text><text x="478" y="176" font-size="11.5" xml:space="preserve" class="mono"><tspan class="green">  filter === · items === → the old list</tspan></text><text x="478" y="198" font-size="11.5" xml:space="preserve" class="mono"><tspan class="green">  shown === last shown → hole skipped</tspan></text><rect x="478" y="232" width="384" height="40" rx="10" fill="#ecfdf0" stroke="#1a7f37" stroke-width="1.1"/><text x="492" y="257" font-size="12" xml:space="preserve" class="green" font-weight="700">no row checked, one hole written: draft</text><line x1="424" y1="170" x2="456" y2="170" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrow-green)" class="flow"/></g></svg>