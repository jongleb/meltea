<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 896 478" width="896" height="478" role="img" aria-label="After a message, only the holes it reaches. Program calls the page&#x27;s slice with the fields written; the view runs once, to mount. Program slices in Meltea: the compiler splits the view into the lets its page reads and the statements it does not, here let () = log model, and gives every hole the bits of the fields it reads: tick, query, shown and picked for the loop, items for Html.memo. After Tick, which writes tick, Program calls the slice with that bit instead of the view: the paragraph of tick is evaluated and written, and the input, the loop and the memo are skipped without looking at any guard inside them. A new frame opens every gate, a local only a guard can follow is compared as before, a gate no message can close is not emitted, and a field no message writes is drawn once, at mount"><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }.muted { fill: #9198a1; } .faint { fill: #6e7681; }.accent { fill: #b58cff; } .green { fill: #3fb950; }.orange { fill: #f0883e; } .blue { fill: #58a6ff; }.flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }@keyframes flow { to { stroke-dashoffset: -28; } }.pulse { animation: pulse 2.2s ease-in-out infinite; }@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }</style><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58cff"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><filter id="lift" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/></filter><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b58cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs><rect x="0" y="0" width="4" height="56" rx="2" fill="url(#glow)"/><text letter-spacing="1.4" x="16" y="13" font-size="11" xml:space="preserve" class="accent" font-weight="800">PROGRAM SLICES</text><text x="16" y="39" font-size="21" xml:space="preserve" font-weight="800">After a message, only the holes it reaches</text><text x="16" y="61" font-size="13" xml:space="preserve" class="muted">Program calls the page&#x27;s slice with the fields written; the view runs once, to mount.</text><line x1="0" y1="76" x2="880" y2="76" stroke="url(#glow)" stroke-width="1.2" opacity="0.35"/><g transform="translate(0 92)"><rect x="0" y="0" width="500" height="330" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#lift)"/><text x="18" y="28" font-size="13.5" xml:space="preserve" font-weight="700">the view, split by the compiler</text><text x="18" y="62" font-size="11.5" xml:space="preserve" class="mono">let view model =</text><text x="18" y="88" font-size="11.5" xml:space="preserve" class="mono faint">  let () = log model in</text><text x="482" y="88" font-size="11" xml:space="preserve" class="muted" text-anchor="end">statement: the slice skips it</text><text x="18" y="114" font-size="11.5" xml:space="preserve" class="mono">  let query = model.query in</text><text x="482" y="114" font-size="11" xml:space="preserve" class="muted" text-anchor="end">read by the page: kept</text><text x="18" y="140" font-size="11.5" xml:space="preserve" class="mono">  &lt;main title=query&gt;</text><text x="18" y="166" font-size="11.5" xml:space="preserve" class="mono">    &lt;p&gt;(Html.int model.tick)&lt;/p&gt;</text><rect x="438.28" y="151" width="43.72" height="21" rx="10.5" fill="#0f2136" stroke="#58a6ff" stroke-width="1.2"/><text x="460.14" y="166" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">tick</text><text x="18" y="192" font-size="11.5" xml:space="preserve" class="mono">    &lt;input value=model.query /&gt;</text><rect x="431.35" y="177" width="50.65" height="21" rx="10.5" fill="#0f2136" stroke="#58a6ff" stroke-width="1.2"/><text x="456.675" y="192" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">query</text><text x="18" y="218" font-size="11.5" xml:space="preserve" class="mono">    (Html.list (List.map row model.shown))</text><rect x="368.98" y="203" width="113.02" height="21" rx="10.5" fill="#0f2136" stroke="#58a6ff" stroke-width="1.2"/><text x="425.49" y="218" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">shown · picked</text><text x="18" y="244" font-size="11.5" xml:space="preserve" class="mono">    (Html.memo summary model.items)</text><rect x="431.35" y="229" width="50.65" height="21" rx="10.5" fill="#0f2136" stroke="#58a6ff" stroke-width="1.2"/><text x="456.675" y="244" font-size="11" xml:space="preserve" class="mono blue" font-weight="700" text-anchor="middle">items</text><text x="18" y="270" font-size="11.5" xml:space="preserve" class="mono">  &lt;/main&gt;</text><text x="18" y="300" font-size="11.5" xml:space="preserve" class="muted">each hole&#x27;s gate: the bits of the fields it reads,</text><text x="18" y="318" font-size="11.5" xml:space="preserve" class="muted">through model.field, the record pattern and the lets</text><text x="530" y="24" font-size="13.5" xml:space="preserve" class="mono accent" font-weight="700">Tick</text><text x="574" y="24" font-size="13.5" xml:space="preserve" font-weight="700">writes { tick }</text><rect x="520" y="42" width="360" height="34" rx="9" fill="#221a38" stroke="#b58cff" stroke-width="1.3" filter="url(#lift)"/><text x="536" y="64" font-size="12" xml:space="preserve" class="mono" font-weight="700">&lt;p&gt; tick</text><text x="866" y="64" font-size="12" xml:space="preserve" class="accent" font-weight="700" text-anchor="end">evaluated, written</text><rect x="520" y="84" width="360" height="34" rx="9" fill="#12261a" stroke="#3fb950" stroke-width="1.3"/><text x="536" y="106" font-size="12" xml:space="preserve" class="mono" font-weight="700">&lt;input&gt; query</text><text x="866" y="106" font-size="12" xml:space="preserve" class="green" font-weight="700" text-anchor="end">gate closed</text><rect x="520" y="126" width="360" height="34" rx="9" fill="#12261a" stroke="#3fb950" stroke-width="1.3"/><text x="536" y="148" font-size="12" xml:space="preserve" class="mono" font-weight="700">the loop</text><text x="866" y="148" font-size="12" xml:space="preserve" class="green" font-weight="700" text-anchor="end">gate closed: no row, no guard</text><rect x="520" y="168" width="360" height="34" rx="9" fill="#12261a" stroke="#3fb950" stroke-width="1.3"/><text x="536" y="190" font-size="12" xml:space="preserve" class="mono" font-weight="700">Html.memo</text><text x="866" y="190" font-size="12" xml:space="preserve" class="green" font-weight="700" text-anchor="end">gate closed</text><rect x="520" y="216" width="360" height="112" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#lift)"/><text x="536" y="242" font-size="13" xml:space="preserve" font-weight="700">Program, after the mount</text><text x="536" y="266" font-size="11.5" xml:space="preserve" class="muted">calls the slice with the bits written</text><text x="536" y="284" font-size="11.5" xml:space="preserve" class="muted">since the last draw, not the view;</text><text x="536" y="302" font-size="11.5" xml:space="preserve" class="muted">a new frame opens every gate, and</text><text x="536" y="320" font-size="11.5" xml:space="preserve" class="muted">a name only a guard can follow is compared</text><text x="440" y="360" font-size="12" xml:space="preserve" class="muted" font-weight="600" text-anchor="middle">A gate no message of update can close is not emitted; a field no message writes is drawn once, at mount.</text></g></svg>